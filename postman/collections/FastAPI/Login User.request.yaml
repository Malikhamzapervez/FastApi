$kind: http-request
description: ""
url: http://127.0.0.1:8000/login
method: POST
body:
  type: urlencoded
  content:
    - key: username
      value: user@example.com
    - key: password
      value: your-password
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json.access_token) {
          pm.vault.set("json_web_token_0k95", json.access_token);
          console.log("JWT token saved to vault successfully.");
      } else {
          console.error("Login failed:", JSON.stringify(json));
      }
